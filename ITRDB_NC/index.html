<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>International Tree Ring Database for North Carolina</title>
    	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css"/>
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.3.0/css/all.css">

    <style>
 	html, body, #map { width: 100%; height: 100%; margin: 0; background: #fff; }

    h1 {
			position: absolute;
			margin-top: 0;
			top: 10px;
			left: 55px;
			font-size: 2em;
			font-family: "Titillium Web", sans-serif;
			letter-spacing: .04em;
			padding: 10px 15px;
			background: #828E82;
			opacity: 70%;
			border: 1px solid grey;
			border-radius: 18px;
			z-index: 800;
		}

    .legend {
    line-height: 40px;
    font-size: 16px;
    font-family: 'Titillium Web', sans-serif;
    width: 190px;
    color: #333333;
    padding: 6px 8px;
    background: white;
    background: rgba(255,255,255,0.5);
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    border-radius: 5px;
}
 
.legend i {
    width: 20px;
    height: 20px;
    float: left;
    margin-right: 8px;
    opacity: 0.9;
}
 
.legend img {
    width: 16px;
    height: 16px;
    margin-right: 3px;
    float: left;
}
 
.legend p {
    font-size: 14px;
    line-height: 20px;
    margin: 0;
}
    </style>
    	<link href="https://fonts.googleapis.com/css?family=Titillium+Web" rel="stylesheet">
	<script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>

</head>
<body>

   <h1>North Carolina ITRDB Datasets</h1>

<!-- Our web map and content will go here -->
<div id="map"></div>
<script>
 
// 1. Create a map object.
var mymap = L.map('map', {
    center: [35.409105803945025, -79.7468462043559], //note that we've centered the map to downtown AVL
    zoom: 7, //this line adjusts the starting zoom level of the map
    maxZoom: 18,//this line sets the maximum zoom level
    minZoom: 7,//this line sets the minimum zoom level
    detectRetina: true // detect whether the screen is high resolution or not.
});

var Stadia_AlidadeSmoothDark = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.{ext}', {
	minZoom: 0,
	maxZoom: 20,
	attribution: '&copy; <a href="https://www.stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
	ext: 'png'
}).addTo(mymap);

var airbnb_listings = null;

var colors = chroma.scale('dark2').mode('lch').colors(5);

for (i = 0; i < 5; i++) {
    $('head').append($("<style> .marker-color-" + (i + 1).toString() + " { color: " + colors[i] + "; font-size: 15px; text-shadow: 0 0 3px #ffffff;} </style>"));
}

ITRDB_Points = L.geoJson.ajax("assets/NC_ITRDB.geojson",{
 
    onEachFeature: function (feature, layer) {
      layer.bindPopup(feature.properties.name + ": " + feature.properties.description);
  },

pointToLayer: function(feature, latlng) {
    var id = 0;
    if (feature.properties.Genus == "Pinus") { id = 0; }
    else if (feature.properties.Genus == "Quercus")  { id = 1; }
    else if (feature.properties.Genus == "Tsuga")  { id = 2; }
    else { id = 3;} // All other property types from attribute table
    return L.marker(latlng, {icon: L.divIcon({className: 'fa-solid fa-tree marker-color-' + (id + 1).toString() })});
  },
    attribution: 'ITRDB Data &copy; National Centers for Environmental Information | North Carolina Climate Divisions Data &copy; NOAA Physical Sciences Laboratory | Map Author: Josh McClellan'
});

ITRDB_Points.addTo(mymap);

colors = chroma.scale('Greens').colors(4);

function setColor(Region) {
    var id = 0;
    if (Region === "Mountains") { id = 3; } 
    else if (Region === "Piedmont") { id = 2; } 
    else if (Region === "Coastal") { id = 1; } 
    else  { id = 0; }
    return colors[id];
}

function style(feature) {
    return {
        fillColor: setColor(feature.properties.Region),
        fillOpacity: 0.4,
        weight: 2,
        opacity: 1,
        color: '#b4b4b4',
        dashArray: '4'
    };
}

L.geoJson.ajax("assets/NC_CLIMDIV.geojson", {
    style: style
}).addTo(mymap);

var legend = L.control({position: 'topright'});

legend.onAdd = function () {
 
    // Create Div Element and Populate it with HTML
    var div = L.DomUtil.create('div', 'legend');
    //this line creates a title for the choropleth part of the legend
    div.innerHTML += '<b>Climatic Division Region</b><br />';
    //notice the class breaks entered at the end of the next 5 lines
    //the colors specify the shade of purple that we used to do the polygon shading
    div.innerHTML += '<i style="background: ' + colors[3] + '; opacity: 0.5"></i><p>Mountains</p>';
    div.innerHTML += '<i style="background: ' + colors[2] + '; opacity: 0.5"></i><p>Piedmont</p>';
    div.innerHTML += '<i style="background: ' + colors[1] + '; opacity: 0.8"></i><p>Coastal</p>';
    //this line provides the legend title for the airbnb colored symbols
    div.innerHTML += '<hr><b>Dataset Genus<b><br />';
    //the next 3 lines call the airbnb icon along with its proper color
    //notice the names of the Airbnb property types listed within the <p> tags at the end of the lines
    div.innerHTML += '<i class="fa-solid fa-tree marker-color-1"></i><p>Pinus spp.</p>';
    div.innerHTML += '<i class="fa-solid fa-tree marker-color-2"></i><p>Quercus spp.</p>';
    div.innerHTML += '<i class="fa-solid fa-tree marker-color-3"></i><p>Tsuga spp.</p>';
    div.innerHTML += '<i class="fa-solid fa-tree marker-color-4"></i><p>Other</p>';
    // Return the Legend div containing the HTML content
    return div;
};

legend.addTo(mymap);

L.control.scale({position: 'bottomleft'}).addTo(mymap);

</script>
</body>
</html>
